# SPDX-License-Identifier: AGPL-3.0-or-later
# Micup v2 Linux checks use the same Fluxer CI commands as upstream tests.yaml;
# Rust runs on GitHub's runner rather than the upstream third-party runner. Timeouts allow for a two-core
# private-repository runner. KL8 adds schema validation on three real Cassandra 5.0 nodes. KL7 (fluxer_app
# typecheck and tests, including wasm codegen) runs inside KL1 and KL2 through fluxer-ci typecheck/test.
# Trigger (budget: 2000 minutes/month, 50–90 minutes/full run): pushes to micup/main; micup/gece uses workflow_dispatch (ref, isler).
name: Micup kapı

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Denetlenecek dal, etiket ya da commit (boş = iş akışının koştuğu dal)
        required: false
        default: ''
      isler:
        description: Yalnız bu kapılar, virgülle (ör. kl2,kl5); boş = hepsi
        required: false
        default: ''
  push:
    branches:
      - micup/main

permissions:
  contents: read

concurrency:
  group: micup-kapi-${{ inputs.ref || github.ref }}-${{ inputs.isler }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_PROFILE_TEST_DEBUG: none
  CARGO_INCREMENTAL: '0'

jobs:
  kl1-typecheck:
    name: KL1 typecheck (+KL7 fluxer_app)
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl1') || contains(inputs.isler, 'kl7') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLUXER_CI_BIN: ${{ github.workspace }}/target/debug/fluxer-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: fluxer-ci önbelleği
        id: ci-helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/fluxer-ci
          key: >-
            fluxer-ci-bin-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}
      - if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package fluxer-ci
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - run: '"$FLUXER_CI_BIN" ci --step install_dependencies'
      - run: '"$FLUXER_CI_BIN" ci --step typecheck'

  kl2-test:
    name: KL2 test (+KL7 fluxer_app, Docker testleri)
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl2') || contains(inputs.isler, 'kl7') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      FLUXER_CI_BIN: ${{ github.workspace }}/target/debug/fluxer-ci
      PNPM_TEST_WORKSPACE_CONCURRENCY: '2'
    steps:
      - name: Docker var mı (yoksa Valkey/Cassandra/Postgres testleri sessizce atlanır)
        run: docker version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: fluxer-ci önbelleği
        id: ci-helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/fluxer-ci
          key: >-
            fluxer-ci-bin-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}
      - if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package fluxer-ci
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - run: '"$FLUXER_CI_BIN" ci --step install_dependencies'
      - name: fluxer_app wasm önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            fluxer_app/pkgs/libfluxcore
            fluxer_app/pkgs/libfluxwebp
            fluxer_app/src/features/messaging/utils/markdown/parser/MarkdownParserWasmBytes.ts
          key: >-
            app-wasm-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'tools/ci/src/app_wasm.rs',
            'tools/ci/templates/libfluxcore_wrapper.js', 'tools/ci/templates/libfluxcore_wrapper.d.ts',
            'fluxer_app/rust/libfluxcore/Cargo.toml', 'fluxer_app/rust/libfluxcore/Cargo.lock',
            'fluxer_app/rust/libfluxcore/.cargo/config.toml', 'fluxer_app/rust/libfluxcore/src/**',
            'fluxer_app/rust/libfluxwebp/Cargo.toml', 'fluxer_app/rust/libfluxwebp/Cargo.lock',
            'fluxer_app/rust/libfluxwebp/src/**', 'fluxer_app/rust/libfluxwebp/shim/**',
            'fluxer_app/rust/libfluxwebp/simd/**',
            'packages/markdown_parser/rust/Cargo.toml', 'packages/markdown_parser/rust/.cargo/config.toml',
            'packages/markdown_parser/rust/src/**') }}
      # Uses the production LiveKit image (infra robot/livekit/compose.yml) for signaling only; no audio or UDP.
      - name: LiveKit kabı (koltuk özelliği yetki testi)
        run: |
          docker run -d --name lk -p 7880:7880 \
            livekit/livekit-server:v1.12.0@sha256:b1281e66e35e8f9749ffbcf0fe6ab4d40d1438aa00f36c2ea7e6975e5e261e2e \
            --dev --bind 0.0.0.0
          for i in $(seq 1 60); do curl -sf http://localhost:7880/ >/dev/null && exit 0; sleep 1; done
          docker logs lk; exit 1
      - run: '"$FLUXER_CI_BIN" ci --step test'
        env:
          MICUP_LIVEKIT_TEST_URL: ws://localhost:7880

  kl3-lint:
    name: KL3 lint (biome + eslint)
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm exec eslint . --max-warnings 0
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  kl3-knip:
    name: KL3 knip
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLUXER_CI_BIN: ${{ github.workspace }}/target/debug/fluxer-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: fluxer-ci önbelleği
        id: ci-helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/fluxer-ci
          key: >-
            fluxer-ci-bin-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}
      - if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package fluxer-ci
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - run: '"$FLUXER_CI_BIN" ci --step install_dependencies'
      - name: fluxer_app wasm önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            fluxer_app/pkgs/libfluxcore
            fluxer_app/pkgs/libfluxwebp
            fluxer_app/src/features/messaging/utils/markdown/parser/MarkdownParserWasmBytes.ts
          key: >-
            app-wasm-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'tools/ci/src/app_wasm.rs',
            'tools/ci/templates/libfluxcore_wrapper.js', 'tools/ci/templates/libfluxcore_wrapper.d.ts',
            'fluxer_app/rust/libfluxcore/Cargo.toml', 'fluxer_app/rust/libfluxcore/Cargo.lock',
            'fluxer_app/rust/libfluxcore/.cargo/config.toml', 'fluxer_app/rust/libfluxcore/src/**',
            'fluxer_app/rust/libfluxwebp/Cargo.toml', 'fluxer_app/rust/libfluxwebp/Cargo.lock',
            'fluxer_app/rust/libfluxwebp/src/**', 'fluxer_app/rust/libfluxwebp/shim/**',
            'fluxer_app/rust/libfluxwebp/simd/**',
            'packages/markdown_parser/rust/Cargo.toml', 'packages/markdown_parser/rust/.cargo/config.toml',
            'packages/markdown_parser/rust/src/**') }}
      - run: '"$FLUXER_CI_BIN" ci --step knip'

  kl4-i18n:
    name: KL4 i18n + KL10 OpenAPI sapması
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl4') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:compile
      - name: Derlenmiş yerel modüller güncel mi
        run: |
          git diff --stat
          if ! git diff --exit-code -- \
            packages/errors/src/i18n/locales \
            packages/errors/src/i18n/ErrorI18nTypes.generated.ts \
            fluxer_api/pkgs/email/src/email_i18n/locales \
            fluxer_api/pkgs/email/src/email_i18n/EmailI18nTypes.generated.ts \
            fluxer_api/src/api/content_i18n/locales; then
            echo "::error::Derlenmiş yerel modüller eski: 'pnpm i18n:compile' çalıştırıp sonucu commit edin (çeviriler weblate/ kataloglarında)."
            exit 1
          fi
      # Matches the upstream dart-sdk-validation.yaml openapi-drift job and shares its setup.
      - run: pnpm openapi:generate
      - run: pnpm openapi:validate
      - name: KL10 OpenAPI şemaları güncel mi
        run: |
          if ! git diff --exit-code -- fluxer_api/src/api/openapi/openapi.json fluxer_admin/openapi-admin.json; then
            echo "::error::OpenAPI şemaları eski: 'pnpm openapi:generate' çalıştırıp sonucu commit edin."
            exit 1
          fi

  kl9-docs:
    name: KL9 docs (verify + build)
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl9') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter fluxer_docs...
      - run: pnpm --filter fluxer_docs verify
      - run: pnpm --filter fluxer_docs build

  kl0-bicim:
    # Runs only on request (isler=bicim): applies the pinned Rust and Erlang formatters and uploads the diff as a patch.
    name: KL0 biçim yaması (cargo fmt + rebar3 fmt)
    if: ${{ contains(inputs.isler, 'bicim') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28'
          rebar3-version: '3.27.0'
      - run: cargo fmt --all
      - run: rebar3 fmt
        working-directory: fluxer_gateway
      - run: git diff > "$RUNNER_TEMP/bicim.patch" && git diff --stat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bicim-patch
          path: ${{ runner.temp }}/bicim.patch

  kl5-rust:
    name: KL5 Rust (deny, fmt, clippy, test)
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl5') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Disk aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo install -d -o "$USER" /opt/fluxer-native
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - name: cargo önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('fluxer_media_proxy/tools/install-native-deps.sh') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('fluxer_media_proxy/tools/install-native-deps.sh') }}-
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check -D warnings
      - run: cargo deny --manifest-path fluxer_app/rust/libfluxwebp/Cargo.toml --config deny.toml --locked check licenses bans sources
      - run: tools/ci/check-desktop-native-workspaces.sh dependencies
      - name: Yerel medya kütüphaneleri önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /opt/fluxer-native
          key: media-native-${{ runner.os }}-${{ hashFiles('fluxer_media_proxy/tools/install-native-deps.sh') }}
      - name: Yerel bağımlılıklar (tests.yaml ile aynı liste)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils clang cmake curl libaom-dev libavfilter-dev libclang-dev \
            libcurl4-openssl-dev libdav1d-dev libde265-dev libfido2-dev libheif-dev liblcms2-dev \
            libpipewire-0.3-dev libspa-0.2-dev libssl-dev libudev-dev libvips-dev libwebp-dev libyuv-dev \
            meson nasm ninja-build pkg-config xz-utils yasm zlib1g-dev
          sudo fluxer_media_proxy/tools/install-native-deps.sh /opt/fluxer-native
          echo "PKG_CONFIG_PATH=/opt/fluxer-native/lib/pkgconfig:/opt/fluxer-native/lib64/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/fluxer-native/lib:/opt/fluxer-native/lib64" >> "$GITHUB_ENV"
          echo "/opt/fluxer-native/bin" >> "$GITHUB_PATH"
      - run: pnpm --filter fluxer_admin install
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fluxer_app/rust/libfluxwebp/Cargo.toml -- --check
      - run: tools/ci/check-desktop-native-workspaces.sh fmt
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: tools/ci/check-desktop-native-workspaces.sh clippy
      - name: Kaynaktan derlenen ffmpeg PATH'te
        run: |
          test "$(command -v ffmpeg)" = /opt/fluxer-native/bin/ffmpeg
          ffmpeg -hide_banner -version
      - run: cargo test --workspace --all-features --locked --no-fail-fast
        env:
          FLUXER_REQUIRE_MEDIA_FIXTURES: '1'
      - run: tools/ci/check-desktop-native-workspaces.sh test
      - if: always()
        run: df -h /

  kl6-gateway:
    name: KL6 Erlang gateway
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl6') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLUXER_CI_BIN: ${{ github.workspace }}/target/debug/fluxer-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
      - name: NIF cargo önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fluxer_gateway/native/guild_member_list_oset_nif/target
            fluxer_gateway/native/push_markdown_plaintext_nif/target
          key: gateway-nif-${{ runner.os }}-1.98.1-${{ hashFiles('fluxer_gateway/native/*/Cargo.lock', 'fluxer_gateway/native/*/Cargo.toml') }}
      - name: fluxer-ci önbelleği
        id: ci-helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/debug/fluxer-ci
          key: >-
            fluxer-ci-bin-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'tools/ci/Cargo.toml', 'tools/ci/src/**', 'tools/ci/templates/**') }}
      - if: steps.ci-helper.outputs.cache-hit != 'true'
        run: cargo build --locked --package fluxer-ci
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28'
          rebar3-version: '3.27.0'
      - name: rebar3 önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/rebar3
            fluxer_gateway/_build
            !fluxer_gateway/_build/default/lib/fluxer_gateway/**
            !fluxer_gateway/_build/test/lib/fluxer_gateway/**
          key: rebar3-${{ runner.os }}-otp28-rebar3.27.0-${{ hashFiles('fluxer_gateway/rebar.lock', 'fluxer_gateway/rebar.config') }}
          restore-keys: |
            rebar3-${{ runner.os }}-otp28-rebar3.27.0-
      - name: Drop restored gateway build output
        run: rm -rf fluxer_gateway/_build/default/lib/fluxer_gateway fluxer_gateway/_build/test/lib/fluxer_gateway
      - run: '"$FLUXER_CI_BIN" ci --step gateway_fmt'
      - run: '"$FLUXER_CI_BIN" ci --step gateway_compile'
      - run: '"$FLUXER_CI_BIN" ci --step gateway_dialyzer'
      - run: '"$FLUXER_CI_BIN" ci --step gateway_eunit'

  kl8-cassandra:
    # Prova kümesinin (micup-v2-infra robot/prova/cassandra.compose.yml) eşdeğeri: aynı imaj, 3 düğüm,
    # 10.88.0.11-13, DC fsn1, GossipingPropertyFileSnitch, sırayla açılış, keyspace NTS fsn1:3 elle
    # (keyspace.cql). Fark: yapılandırma Cassandra 5.0'ın cassandra_latest.yaml'ı (Micup yaml'ı infra
    # deposunda, bu depoda değil); kimlik doğrulama kapalı olabilir, cassandra/cassandra her iki durumda geçer.
    name: KL8 Cassandra 5.0 3 düğüm şema provası
    if: ${{ !inputs.isler || contains(inputs.isler, 'kl8') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CASSANDRA_IMAJ: cassandra:5.0.9
      FLUXER_CASSANDRA_HOSTS: 10.88.0.11,10.88.0.12,10.88.0.13
      FLUXER_CASSANDRA_KEYSPACE: fluxer
      FLUXER_CASSANDRA_LOCAL_DC: fsn1
      FLUXER_CASSANDRA_USERNAME: cassandra
      FLUXER_CASSANDRA_PASSWORD: cassandra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
      - name: fluxer-dev önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fluxer-dev-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'tools/dev/**') }}
          restore-keys: |
            fluxer-dev-${{ runner.os }}-1.98.1-
      - run: cargo build --locked -p fluxer-dev
      - name: 3 düğümlü küme (c1 → c2 → c3 sırayla)
        run: |
          docker network create --subnet 10.88.0.0/24 micup-prova
          for i in 1 2 3; do
            docker run -d --name "c$i" --network micup-prova --ip "10.88.0.1$i" \
              --ulimit memlock=-1 --ulimit nofile=1048576:1048576 \
              -e CASSANDRA_CLUSTER_NAME=micup -e CASSANDRA_SEEDS=10.88.0.11,10.88.0.12 \
              -e CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch -e CASSANDRA_DC=fsn1 -e CASSANDRA_RACK=rack1 \
              -e MAX_HEAP_SIZE=1G -e HEAP_NEWSIZE=256M \
              --entrypoint sh "$CASSANDRA_IMAJ" \
              -c 'cp /etc/cassandra/cassandra_latest.yaml /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f'
            for _ in $(seq 60); do
              if docker exec "c$i" nodetool info 2>/dev/null | grep -Eq 'Native Transport active *: *true'; then
                echo "c$i hazır"
                continue 2
              fi
              sleep 5
            done
            docker logs --tail 80 "c$i"
            echo "::error::c$i 5 dakikada açılmadı"
            exit 1
          done
          docker exec c1 nodetool status
          test "$(docker exec c1 nodetool status | grep -c '^UN')" = 3
      - name: Keyspace NTS fsn1:3 (fluxer-dev'e bırakılmaz, Ö7 sonrası keyspace yoksa hata verir)
        run: |
          docker exec c1 cqlsh 10.88.0.11 -u cassandra -p cassandra -e "
            ALTER KEYSPACE system_auth WITH replication = {'class': 'NetworkTopologyStrategy', 'fsn1': 3};
            ALTER KEYSPACE system_distributed WITH replication = {'class': 'NetworkTopologyStrategy', 'fsn1': 3};
            ALTER KEYSPACE system_traces WITH replication = {'class': 'NetworkTopologyStrategy', 'fsn1': 3};
            CREATE KEYSPACE IF NOT EXISTS fluxer WITH replication = {'class': 'NetworkTopologyStrategy', 'fsn1': 3};"
      - name: cassandra diff → apply → verify
        run: |
          target/debug/fluxer-dev cassandra diff --output "$RUNNER_TEMP/diff-once.cql"
          grep -c ';$' "$RUNNER_TEMP/diff-once.cql" || true
          target/debug/fluxer-dev cassandra apply
          target/debug/fluxer-dev cassandra verify
      - name: İkinci diff boş (apply tekrar edilebilir) ve keyspace çoğaltması korunmuş
        run: |
          target/debug/fluxer-dev cassandra diff --output "$RUNNER_TEMP/diff-sonra.cql"
          cat "$RUNNER_TEMP/diff-sonra.cql"
          grep -q -- '-- No schema changes required.' "$RUNNER_TEMP/diff-sonra.cql"
          docker exec c1 cqlsh 10.88.0.11 -u cassandra -p cassandra \
            -e "SELECT replication FROM system_schema.keyspaces WHERE keyspace_name = 'fluxer'" | tee "$RUNNER_TEMP/rf.txt"
          grep -q "NetworkTopologyStrategy', 'fsn1': '3'" "$RUNNER_TEMP/rf.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - name: Kullanıcı adı Paxos testi (gerçek 3 düğüm, ayrı tek kullanımlık keyspace)
        env:
          FLUXER_DATABASE_BACKEND: cassandra
          FLUXER_CASSANDRA_KEYSPACE: fluxer_username_test_ci
          USERNAME_CASSANDRA_TEST: '1'
          USERNAME_CASSANDRA_TEST_KEYSPACE: fluxer_username_test_ci
        shell: bash
        run: |
          docker exec c1 cqlsh 10.88.0.11 -u cassandra -p cassandra -e "
            CREATE KEYSPACE IF NOT EXISTS fluxer_username_test_ci WITH replication = {'class': 'NetworkTopologyStrategy', 'fsn1': 3};"
          target/debug/fluxer-dev cassandra apply
          pnpm install --frozen-lockfile --filter fluxer_api...
          pnpm --filter fluxer_api exec vitest run --reporter=default src/api/user/username/tests/Ownership.cassandra.test.ts \
            | tee "$RUNNER_TEMP/username-paxos.txt"
          # A skipped suite must not count as a pass.
          if grep -q 'skipped' "$RUNNER_TEMP/username-paxos.txt"; then echo "::error::username Paxos suite skipped"; exit 1; fi
      - name: Ö7 — 3 düğümde RF=1 ret (var olan keyspace ve --replication SimpleStrategy)
        run: |
          docker exec c1 cqlsh 10.88.0.11 -u cassandra -p cassandra -e "
            CREATE KEYSPACE IF NOT EXISTS o7_rf1 WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
          if FLUXER_CASSANDRA_KEYSPACE=o7_rf1 target/debug/fluxer-dev cassandra diff \
            --output "$RUNNER_TEMP/o7-rf1.cql" >"$RUNNER_TEMP/o7-rf1.out" 2>&1; then
            echo "::error::var olan RF=1 keyspace 3 düğümde diff'ten geçti"
            exit 1
          fi
          grep -q 'unsafe on 3 Cassandra hosts' "$RUNNER_TEMP/o7-rf1.out"
          if FLUXER_CASSANDRA_KEYSPACE=o7_rf1 target/debug/fluxer-dev cassandra apply; then
            echo "::error::var olan RF=1 keyspace 3 düğümde apply'dan geçti"
            exit 1
          fi
          if FLUXER_CASSANDRA_KEYSPACE=o7_rf1_yeni target/debug/fluxer-dev cassandra diff \
            --replication "{'class': 'SimpleStrategy', 'replication_factor': 1}" \
            --output "$RUNNER_TEMP/o7-rf1-yeni.cql" >"$RUNNER_TEMP/o7-rf1-yeni.out" 2>&1; then
            echo "::error::--replication SimpleStrategy RF=1 3 düğümde diff'ten geçti"
            exit 1
          fi
          grep -q 'unsafe on 3 Cassandra hosts' "$RUNNER_TEMP/o7-rf1-yeni.out"
      - name: Ö7 — replikasyonsuz ret, --replication NTS, bir düğüm kapalıyken verify
        run: |
          if FLUXER_CASSANDRA_KEYSPACE=o7_yok target/debug/fluxer-dev cassandra diff \
            --output "$RUNNER_TEMP/o7-yok.cql" 2>"$RUNNER_TEMP/o7-yok.err"; then
            echo "::error::replikasyonsuz diff geçti"
            exit 1
          fi
          grep -q -- '--replication' "$RUNNER_TEMP/o7-yok.err"
          FLUXER_CASSANDRA_KEYSPACE=o7_nts target/debug/fluxer-dev cassandra diff \
            --replication "{'class': 'NetworkTopologyStrategy', 'fsn1': 3}" --output "$RUNNER_TEMP/o7-nts.cql"
          grep -q "CREATE KEYSPACE IF NOT EXISTS o7_nts WITH replication = {'class': 'NetworkTopologyStrategy', 'fsn1': 3};" \
            "$RUNNER_TEMP/o7-nts.cql"
          if grep -q SimpleStrategy "$RUNNER_TEMP/o7-nts.cql"; then
            echo "::error::--replication NTS verildiği halde SimpleStrategy üretildi"
            exit 1
          fi
          docker stop c1
          target/debug/fluxer-dev cassandra verify
      - if: failure()
        run: for i in 1 2 3; do docker logs --tail 60 "c$i" || true; done
